<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여권 정보 입력 — UX 프로토타입</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-page:    #f0ede8;
    --bg-card:    #ffffff;
    --bg-surface: #f7f6f3;
    --border:     #e2dfd8;
    --border-strong: #c8c4bc;
    --text-primary:   #1a1917;
    --text-secondary: #5c5a55;
    --text-muted:     #9c9990;

    --green-bg:   #eaf3de;
    --green-bd:   #7cba3a;
    --green-text: #3b6d11;
    --green-fill: #4a8a1a;

    --amber-bg:   #fef3db;
    --amber-bd:   #e6a020;
    --amber-text: #7a4d00;
    --amber-fill: #d4870a;

    --red-bg:     #fdeaea;
    --red-bd:     #e05050;
    --red-text:   #8b1f1f;
    --red-fill:   #c73535;

    --blue-bg:    #e8f2fd;
    --blue-bd:    #5096d6;
    --blue-text:  #1a4f8a;
    --blue-fill:  #2a72c8;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
  }

  body {
    font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg-page);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 배경 예약 페이지 ── */
  .page-bg {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 2rem;
    position: relative;
  }

  .booking-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem;
    width: 100%;
    max-width: 640px;
    filter: blur(2px);
    pointer-events: none;
    user-select: none;
  }

  .booking-skeleton-title {
    height: 22px;
    width: 60%;
    background: var(--border);
    border-radius: 4px;
    margin-bottom: 1.25rem;
  }

  .booking-skeleton-row {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
  }

  .booking-skeleton-field {
    height: 14px;
    background: var(--bg-surface);
    border-radius: 4px;
  }

  .passport-trigger-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
  }

  .trigger-label {
    height: 16px;
    width: 40%;
    background: var(--border);
    border-radius: 4px;
  }

  .trigger-btn-mock {
    height: 36px;
    width: 120px;
    background: var(--blue-fill);
    border-radius: var(--radius-sm);
  }

  /* ── 오버레이 ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 14, 12, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    z-index: 100;
  }

  /* ── 팝업 ── */
  .popup {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 520px;
    box-shadow: 0 20px 60px rgba(0,0,0,.18), 0 4px 16px rgba(0,0,0,.10);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: popup-in .2s ease;
  }

  @keyframes popup-in {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── 팝업 헤더 ── */
  .popup-header {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    padding: .875rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .popup-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .popup-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .progress-pill {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    transition: all .2s;
  }

  .progress-pill.has-complete {
    background: var(--green-bg);
    border-color: var(--green-bd);
    color: var(--green-text);
  }

  .popup-close {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    transition: background .15s, color .15s;
  }

  .popup-close:hover { background: var(--border); color: var(--text-primary); }

  /* ── 탭 ── */
  .tabs-wrap {
    padding: .75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    flex-shrink: 0;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .tab {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 7px 6px 6px;
    text-align: center;
    cursor: pointer;
    background: var(--bg-surface);
    transition: all .18s;
    position: relative;
  }

  .tab:hover:not(.tab--active-ok):not(.tab--active-warn):not(.tab--active-err) {
    border-color: var(--border-strong);
    background: var(--bg-card);
  }

  .tab-name {
    font-size: 11px;
    font-weight: 600;
    display: block;
    color: var(--text-secondary);
    transition: color .18s;
  }

  .tab-status {
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    margin-top: 3px;
    color: var(--text-muted);
    transition: color .18s;
  }

  .tab-status svg { width: 11px; height: 11px; flex-shrink: 0; }

  /* 완성 */
  .tab--complete {
    border-color: var(--green-bd);
    background: var(--green-bg);
  }
  .tab--complete .tab-name  { color: var(--green-text); }
  .tab--complete .tab-status { color: var(--green-text); }

  /* 미완성(경고) */
  .tab--warn {
    border-color: var(--amber-bd);
    background: var(--amber-bg);
  }
  .tab--warn .tab-name  { color: var(--amber-text); }
  .tab--warn .tab-status { color: var(--amber-text); }

  /* 활성 + 정상 */
  .tab--active-ok {
    border-color: var(--blue-bd);
    border-width: 2px;
    background: var(--blue-bg);
  }
  .tab--active-ok .tab-name  { color: var(--blue-text); }
  .tab--active-ok .tab-status { color: var(--blue-text); }

  /* 활성 + 경고 */
  .tab--active-warn {
    border-color: var(--amber-bd);
    border-width: 2px;
    background: var(--amber-bg);
  }
  .tab--active-warn .tab-name  { color: var(--amber-text); }
  .tab--active-warn .tab-status { color: var(--amber-text); }

  /* 활성 + 오류 */
  .tab--active-err {
    border-color: var(--red-bd);
    border-width: 2px;
    background: var(--red-bg);
  }
  .tab--active-err .tab-name  { color: var(--red-text); }
  .tab--active-err .tab-status { color: var(--red-text); }

  /* ── 배너 ── */
  .banner {
    margin: .75rem 1.25rem 0;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    display: none;
    align-items: flex-start;
    gap: 7px;
    line-height: 1.5;
  }
  .banner.show { display: flex; }
  .banner svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }

  .banner--err {
    background: var(--red-bg);
    border: 1px solid var(--red-bd);
    color: var(--red-text);
  }

  /* ── 폼 ── */
  .form-area {
    padding: .875rem 1.25rem;
    flex: 1;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: color .15s;
  }

  .field-label.required::after {
    content: ' *';
    color: var(--red-fill);
  }

  .field-label.state-err { color: var(--red-text); }

  .field-input {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-card);
    font-family: inherit;
    transition: border-color .15s, background .15s, box-shadow .15s;
    outline: none;
    width: 100%;
  }

  .field-input::placeholder { color: var(--text-muted); }

  .field-input:focus {
    border-color: var(--blue-bd);
    box-shadow: 0 0 0 3px rgba(80, 150, 214, .15);
  }

  .field-input.state-filled { border-color: var(--green-bd); }
  .field-input.state-filled:focus {
    border-color: var(--blue-bd);
    box-shadow: 0 0 0 3px rgba(80, 150, 214, .15);
  }

  .field-input.state-err {
    border-color: var(--red-bd);
    background: var(--red-bg);
    box-shadow: 0 0 0 3px rgba(224, 80, 80, .12);
  }

  /* Disabled */
  .field-input:disabled {
    background: var(--bg-surface);
    border-color: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  /* Select wrapper */
  .select-wrap { position: relative; }
  .select-wrap select {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 30px 8px 10px;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-card);
    font-family: inherit;
    transition: border-color .15s, background .15s, box-shadow .15s;
    outline: none;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }
  .select-wrap select:focus {
    border-color: var(--blue-bd);
    box-shadow: 0 0 0 3px rgba(80, 150, 214, .15);
  }
  .select-wrap select.state-filled { border-color: var(--green-bd); }
  .select-wrap select.state-err {
    border-color: var(--red-bd);
    background: var(--red-bg);
    box-shadow: 0 0 0 3px rgba(224, 80, 80, .12);
  }
  .select-chevron {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--text-muted);
  }

  .field-error {
    font-size: 11px;
    color: var(--red-text);
    display: none;
    align-items: center;
    gap: 3px;
  }
  .field-error.show { display: flex; }
  .field-error svg { width: 12px; height: 12px; flex-shrink: 0; }

  /* ── 바텀 바 ── */
  .bottom-bar {
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
    padding: .875rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn {
    padding: 10px 0;
    width: 80%;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    border: 1.5px solid transparent;
    line-height: 1;
    text-align: center;
  }

  .btn-primary {
    background: var(--blue-fill);
    color: #fff;
    border-color: transparent;
  }
  .btn-primary:hover { background: #1e5faf; }
  .btn-primary:active { transform: scale(.98); }

  /* ── 저장 완료 화면 ── */
  .success-screen {
    padding: 2.5rem 1.25rem;
    text-align: center;
    display: none;
  }

  .success-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--green-bg);
    border: 2px solid var(--green-bd);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
  }

  .success-icon svg { width: 26px; height: 26px; color: var(--green-fill); }
  .success-title { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: .5rem; }
  .success-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  .incomplete-notice {
    margin: 1rem auto 0;
    max-width: 320px;
    background: var(--amber-bg);
    border: 1px solid var(--amber-bd);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    text-align: left;
    font-size: 12px;
    color: var(--amber-text);
    display: none;
  }

  .incomplete-notice.show { display: block; }
  .incomplete-notice strong { font-weight: 600; display: block; margin-bottom: 3px; }

  /* ── 하단 범례 ── */
  .legend {
    display: flex;
    gap: 1.25rem;
    justify-content: center;
    padding: 1rem;
    background: rgba(255,255,255,.6);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* ── 토스트 ── */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1917;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 12px 20px;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    white-space: nowrap;
    z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast svg { width: 16px; height: 16px; color: var(--green-bd); flex-shrink: 0; }

  /* 셰이크 애니메이션 */
  @keyframes shake {
    0%,100%{ transform: translateX(0); }
    20%    { transform: translateX(-5px); }
    40%    { transform: translateX(5px); }
    60%    { transform: translateX(-4px); }
    80%    { transform: translateX(4px); }
  }
  .shake { animation: shake .35s ease; }
</style>
</head>
<body>

<!-- 배경: 예약 페이지 블러 처리 -->
<div class="page-bg">
  <div class="booking-card" aria-hidden="true">
    <div class="booking-skeleton-title"></div>
    <div class="booking-skeleton-row">
      <div class="booking-skeleton-field" style="width:30%"></div>
      <div class="booking-skeleton-field" style="width:50%"></div>
    </div>
    <div class="booking-skeleton-row">
      <div class="booking-skeleton-field" style="width:45%"></div>
      <div class="booking-skeleton-field" style="width:35%"></div>
    </div>
    <div class="booking-skeleton-row">
      <div class="booking-skeleton-field" style="width:55%"></div>
      <div class="booking-skeleton-field" style="width:25%"></div>
    </div>
    <div class="passport-trigger-row">
      <div class="trigger-label"></div>
      <div class="trigger-btn-mock"></div>
    </div>
  </div>

  <!-- 팝업 오버레이 -->
  <div class="overlay" id="overlay">
    <div class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title-text">

      <!-- 헤더 -->
      <div class="popup-header">
        <div class="popup-header-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-secondary)" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          <span class="popup-title" id="popup-title-text">여권 정보 입력</span>
          <span class="progress-pill" id="progress-pill">0 / 4 완성</span>
        </div>
        <button class="popup-close" onclick="closePopup()" aria-label="닫기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- 탭 -->
      <div class="tabs-wrap">
        <div class="tabs" role="tablist">
          <div class="tab tab--active-ok" id="tab-0" role="tab" aria-selected="true" tabindex="0" onclick="selectTab(0)">
            <span class="tab-name">탑승객 1</span>
            <span class="tab-status" id="ts-0">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>
              미입력
            </span>
          </div>
          <div class="tab" id="tab-1" role="tab" aria-selected="false" tabindex="-1" onclick="selectTab(1)">
            <span class="tab-name">탑승객 2</span>
            <span class="tab-status" id="ts-1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>
              미입력
            </span>
          </div>
          <div class="tab" id="tab-2" role="tab" aria-selected="false" tabindex="-1" onclick="selectTab(2)">
            <span class="tab-name">탑승객 3</span>
            <span class="tab-status" id="ts-2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>
              미입력
            </span>
          </div>
          <div class="tab" id="tab-3" role="tab" aria-selected="false" tabindex="-1" onclick="selectTab(3)">
            <span class="tab-name">탑승객 4</span>
            <span class="tab-status" id="ts-3">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>
              미입력
            </span>
          </div>
        </div>
      </div>

      <!-- 오류/경고 배너 -->
      <div class="banner banner--err" id="err-banner" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor" stroke-width="1.5"/></svg>
        <span id="err-banner-text"></span>
      </div>

      <!-- 폼 -->
      <div class="form-area" id="form-area">
        <div class="form-grid">
          <div class="field-wrap">
            <label class="field-label required" id="lbl-nat" for="f-nat">국적</label>
            <div class="select-wrap">
              <select id="f-nat" onchange="onFieldInput('nat', this.value)" onfocus="clearFieldError('nat')">
                <option value="">선택하세요</option>
                <option value="대한민국">대한민국</option>
                <option value="미국">미국</option>
                <option value="일본">일본</option>
                <option value="중국">중국</option>
                <option value="영국">영국</option>
                <option value="캐나다">캐나다</option>
                <option value="호주">호주</option>
                <option value="기타">기타</option>
              </select>
              <span class="select-chevron" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg>
              </span>
            </div>
            <span class="field-error" id="ferr-nat" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor" stroke-width="1.5"/></svg>
              국적을 선택해 주세요.
            </span>
          </div>
          <div class="field-wrap">
            <label class="field-label required" id="lbl-num" for="f-num">여권번호</label>
            <input class="field-input" id="f-num" type="text" placeholder="" autocomplete="off"
              oninput="onFieldInput('num', this.value)" onfocus="clearFieldError('num')">
            <span class="field-error" id="ferr-num" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor" stroke-width="1.5"/></svg>
              여권번호를 입력해 주세요.
            </span>
          </div>
          <div class="field-wrap">
            <label class="field-label required" id="lbl-exp" for="f-exp">여권 만료일</label>
            <input class="field-input" id="f-exp" type="text" placeholder="YYYYMMDD" autocomplete="off"
              oninput="onFieldInput('exp', this.value)" onfocus="clearFieldError('exp')">
            <span class="field-error" id="ferr-exp" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor" stroke-width="1.5"/></svg>
              여권 만료일을 입력해 주세요.
            </span>
          </div>
          <div class="field-wrap">
            <label class="field-label required" id="lbl-iss" for="f-iss">여권 발행국</label>
            <div class="select-wrap">
              <select id="f-iss" onchange="onFieldInput('iss', this.value)" onfocus="clearFieldError('iss')">
                <option value="">선택하세요</option>
                <option value="대한민국">대한민국</option>
                <option value="미국">미국</option>
                <option value="일본">일본</option>
                <option value="중국">중국</option>
                <option value="영국">영국</option>
                <option value="캐나다">캐나다</option>
                <option value="호주">호주</option>
                <option value="기타">기타</option>
              </select>
              <span class="select-chevron" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg>
              </span>
            </div>
            <span class="field-error" id="ferr-iss" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor" stroke-width="1.5"/></svg>
              여권 발행국을 선택해 주세요.
            </span>
          </div>
        </div>
      </div>

      <!-- 저장 완료 화면 -->
      <div class="success-screen" id="success-screen">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="success-title">여권 정보가 저장되었습니다</p>
        <p class="success-sub" id="success-sub"></p>
        <div class="incomplete-notice" id="incomplete-notice">
          <strong>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-1px;margin-right:3px" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r=".5" fill="currentColor" stroke-width="1.5"/></svg>
            미완성 탑승객이 있습니다
          </strong>
          <span id="incomplete-detail"></span>
        </div>
      </div>

      <!-- 바텀 바 -->
      <div class="bottom-bar" id="bottom-bar">
        <button class="btn btn-primary" id="btn-save" onclick="onSave()">저장</button>
      </div>

    </div>
  </div>
</div>

<!-- 토스트 배너 -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
  저장이 완료되었습니다
</div>

<!-- 하단 범례 -->
<div class="legend" aria-label="탭 상태 범례">
  <div class="legend-item"><div class="legend-dot" style="background:var(--bg-surface);border:1.5px solid var(--border)"></div> 미입력</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--blue-bg);border:2px solid var(--blue-bd)"></div> 현재 탭</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--green-bg);border:1.5px solid var(--green-bd)"></div> 완성</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--amber-bg);border:1.5px solid var(--amber-bd)"></div> 일부 입력(미완성)</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--red-bg);border:2px solid var(--red-bd)"></div> 오류(저장 차단)</div>
</div>

<script>
// ── 데이터 ──────────────────────────────────────────────────
const FIELDS = ['nat', 'num', 'exp', 'iss'];
const NUM_PAX = 4;

const paxData = Array.from({length: NUM_PAX}, () => ({nat:'', num:'', exp:'', iss:''}));

let currentTab = 0;
let saveAttempted = false;

// ── 탭 전환 ──────────────────────────────────────────────────
function selectTab(idx) {
  if (idx === currentTab) return;
  saveCurrentTabData();
  const prev = currentTab;
  currentTab = idx;
  loadTabData(idx);
  clearAllFieldErrors();
  hideBanners();
  saveAttempted = false;
  renderAllTabs();
  updateBottomBar();
}

function saveCurrentTabData() {
  paxData[currentTab].nat = document.getElementById('f-nat').value;
  paxData[currentTab].num = document.getElementById('f-num').value.trim();
  paxData[currentTab].exp = document.getElementById('f-exp').value.trim();
  paxData[currentTab].iss = document.getElementById('f-iss').value;
}

function loadTabData(idx) {
  const d = paxData[idx];
  document.getElementById('f-nat').value = d.nat;
  document.getElementById('f-num').value = d.num;
  document.getElementById('f-exp').value = d.exp;
  document.getElementById('f-iss').value = d.iss;
  updateSelectAppearance('f-nat', d.nat);
  updateSelectAppearance('f-iss', d.iss);
  updateInputAppearance(document.getElementById('f-num'), 'num');
  updateInputAppearance(document.getElementById('f-exp'), 'exp');
}

// ── 필드 입력 핸들러 ──────────────────────────────────────────
function onFieldInput(fieldKey, val) {
  paxData[currentTab][fieldKey] = (val || '').trim();
  renderAllTabs();
  updateBottomBar();
  if (isComplete(currentTab)) {
    hideBanners();
    clearAllFieldErrors();
    saveAttempted = false;
    renderAllTabs();
  }
}

function updateInputAppearance(el, fieldKey) {
  el.classList.remove('state-filled', 'state-err');
  if (el.value.trim()) el.classList.add('state-filled');
}

function updateSelectAppearance(id, val) {
  const el = document.getElementById(id);
  el.classList.remove('state-filled', 'state-err');
  if (val) el.classList.add('state-filled');
}

function clearFieldError(fieldKey) {
  if (saveAttempted && paxData[currentTab][fieldKey]) return;
  const idMap = { nat:'f-nat', num:'f-num', exp:'f-exp', iss:'f-iss' };
  const el = document.getElementById(idMap[fieldKey]);
  if (el) { el.classList.remove('state-err'); }
  document.getElementById('ferr-' + fieldKey)?.classList.remove('show');
  document.getElementById('lbl-' + fieldKey)?.classList.remove('state-err');
}

function clearAllFieldErrors() {
  FIELDS.forEach(f => {
    const idMap = { nat:'f-nat', num:'f-num', exp:'f-exp', iss:'f-iss' };
    document.getElementById(idMap[f])?.classList.remove('state-err');
    document.getElementById('ferr-' + f)?.classList.remove('show');
    document.getElementById('lbl-' + f)?.classList.remove('state-err');
  });
}

// ── 상태 판단 ────────────────────────────────────────────────
function isEmpty(idx) { return FIELDS.every(f => !paxData[idx][f]); }
function isComplete(idx) { return FIELDS.every(f => !!paxData[idx][f]); }
function isPartial(idx) {
  const vals = FIELDS.map(f => !!paxData[idx][f]);
  return vals.some(v => v) && !vals.every(v => v);
}
function countComplete() { return Array.from({length:NUM_PAX},(_,i)=>i).filter(isComplete).length; }
function getPartialList() { return Array.from({length:NUM_PAX},(_,i)=>i).filter(isPartial); }

// ── 탭 렌더링 ────────────────────────────────────────────────
const SVG_EMPTY    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>`;
const SVG_COMPLETE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>`;
const SVG_WARN     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r=".5" fill="currentColor" stroke-width="1.5"/></svg>`;
const SVG_ERR      = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="currentColor" stroke-width="1.5"/></svg>`;

function getTabClass(idx) {
  const active = idx === currentTab;
  if (isComplete(idx)) return active ? 'tab tab--active-ok' : 'tab tab--complete';
  if (isPartial(idx))  return active ? 'tab tab--active-err' : 'tab tab--warn';
  return active ? 'tab tab--active-ok' : 'tab';
}

function getTabStatusContent(idx) {
  if (isComplete(idx)) return SVG_COMPLETE + ' 완성';
  if (isPartial(idx))  return SVG_WARN + ' 일부 입력';
  return SVG_EMPTY + ' 미입력';
}

function renderAllTabs() {
  for (let i = 0; i < NUM_PAX; i++) {
    const el = document.getElementById('tab-' + i);
    el.className = getTabClass(i);
    document.getElementById('ts-' + i).innerHTML = getTabStatusContent(i);
    el.setAttribute('aria-selected', i === currentTab ? 'true' : 'false');
  }
  const n = countComplete();
  const pill = document.getElementById('progress-pill');
  pill.textContent = n + ' / ' + NUM_PAX + ' 완성';
  pill.className = 'progress-pill' + (n > 0 ? ' has-complete' : '');
}

// ── 바텀 바 ──────────────────────────────────────────────────
function updateBottomBar() {
  // hint text removed
}

// ── 배너 ─────────────────────────────────────────────────────
function hideBanners() { document.getElementById('err-banner').classList.remove('show'); }

function showErrBanner(html) {
  const b = document.getElementById('err-banner');
  document.getElementById('err-banner-text').innerHTML = html;
  b.classList.add('show');
}

// ── 저장 ─────────────────────────────────────────────────────
function onSave() {
  saveCurrentTabData();
  renderAllTabs();

  const partials = getPartialList();

  if (partials.length > 0) {
    jumpToPartialTab(partials[0]);
    return;
  }

  if (countComplete() === 0) {
    document.getElementById('popup').classList.add('shake');
    setTimeout(() => document.getElementById('popup').classList.remove('shake'), 400);
    return;
  }

  showSuccessScreen();
}

function jumpToPartialTab(idx) {
  currentTab = idx;
  loadTabData(idx);
  renderAllTabs();
  updateBottomBar();
  saveAttempted = true;

  const emptyFields = FIELDS.filter(f => !paxData[idx][f]);
  const idMap = { nat:'f-nat', num:'f-num', exp:'f-exp', iss:'f-iss' };

  emptyFields.forEach(f => {
    const el = document.getElementById(idMap[f]);
    if (el) el.classList.add('state-err');
    document.getElementById('ferr-' + f)?.classList.add('show');
    document.getElementById('lbl-' + f)?.classList.add('state-err');
  });

  // 탭 오류 스타일 강제 적용
  document.getElementById('tab-' + idx).className = 'tab tab--active-err';
  document.getElementById('ts-' + idx).innerHTML = SVG_ERR + ' 미완성';

  hideBanners();

  const firstEmpty = document.getElementById(idMap[emptyFields[0]]);
  if (firstEmpty) firstEmpty.focus();
}

// ── 저장 완료 ────────────────────────────────────────────────
function showSuccessScreen() {
  hideBanners();
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ── 닫기 ─────────────────────────────────────────────────────
function closePopup() {
  document.getElementById('overlay').style.opacity = '0';
  document.getElementById('overlay').style.transition = 'opacity 0.2s';
  setTimeout(() => document.getElementById('overlay').style.display = 'none', 200);
}

// ── 초기화 ───────────────────────────────────────────────────
renderAllTabs();
updateBottomBar();
</script>
</body>
</html>
